services:
  - type: web
    name: lover-render-storage
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: lover-storage-disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/uploads
      - key: MAX_FILE_MB
        value: "100"
